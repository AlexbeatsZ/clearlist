name: Check

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm test
      - run: npm run build
      - run: npx playwright install chromium
      - run: npm run test:e2e
      - run: node scripts/smoke-desktop.mjs
      - run: npm run dist:win
      - run: npm run test:portable
      - uses: actions/upload-artifact@v4
        with:
          name: Clearlist-Windows-x64
          path: release/Clearlist-*-Windows-x64.exe
